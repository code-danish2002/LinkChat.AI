services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env            # must contain DATABASE_URL (Postgres with pgvector) and provider keys
    environment:
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - backend-data:/app/data    # embedding model cache and in-flight uploads only
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
